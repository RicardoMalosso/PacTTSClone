name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Stop superseded validation runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'tests.yml', branch: context.ref.replace('refs/heads/', ''),
              status: 'in_progress', per_page: 20
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id < context.runId) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                    ...context.repo, run_id: run.id
                  });
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }
            }
  core:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -vv --timeout=15
        timeout-minutes: 3
      - run: python -m pip wheel --no-deps . -w dist
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
  browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser --browser chromium -q
