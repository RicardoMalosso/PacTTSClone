name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-tools:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 8ae0b34901ba60a802f183ee75a250a9fc3e09a5
          path: build-sources/ffmpeg
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git python make nasm diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-lame
      - shell: msys2 {0}
        run: bash installer/build-ffmpeg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source-built-windows-ffmpeg
          path: installer/ffmpeg/bin/*.exe
  core:
    needs: windows-tools
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: source-built-windows-ffmpeg
          path: ffmpeg-tools
      - name: FFmpeg path (Windows, built from official source)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:GITHUB_WORKSPACE 'ffmpeg-tools')
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -vv --timeout=15
        timeout-minutes: 3
      - run: python scripts/fetch-countermeasure-gif.py
      - run: python -m pip wheel --no-deps . -w dist
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
  browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/fetch-countermeasure-gif.py
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser --browser chromium -q
