name: KittenTTS2 isolated runtime acceptance
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kitten-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'kitten-runtime-acceptance'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verified source and actual isolated CUDA dependencies (no GPU inference)
        run: python -m pacttsclone.ming_install --profile kitten --root "${{ runner.temp }}/kitten-runtime" --runtime-only
      - name: Repeat runtime install to verify cache and package reuse
        run: python -m pacttsclone.ming_install --profile kitten --root "${{ runner.temp }}/kitten-runtime" --runtime-only
