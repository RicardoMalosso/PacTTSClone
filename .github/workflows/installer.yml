name: Windows installer preview
on:
  workflow_call:
    inputs:
      publish_draft:
        description: 'Create a validated draft prerelease on main'
        type: boolean
        required: false
        default: false
      publish_release:
        description: 'Publish RC10 after full acceptance (main only)'
        type: boolean
        required: false
        default: false
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      publish_draft:
        description: 'Create a draft prerelease (main branch only)'
        type: boolean
        required: true
        default: false
      publish_release:
        description: 'Publish RC10 after full acceptance (main only)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality-gate:
    name: Full test suite
    if: github.event_name != 'pull_request' || github.event.label.name == 'installer-acceptance' || (github.event.action == 'closed' && github.event.pull_request.merged && (contains(github.event.pull_request.labels.*.name, 'prepare-release') || contains(github.event.pull_request.labels.*.name, 'publish-release')))
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  windows-setup:
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts and download/cache helpers
        shell: powershell
        run: |
          Get-ChildItem installer/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
          & ./installer/test-common.ps1
      - name: Fetch verified Gyan FFmpeg Essentials
        run: python scripts/fetch-gyan-ffmpeg.py
      - name: Build application wheel
        run: python -m pip wheel --no-deps . -w dist
      - name: Compile small unsigned setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $setup = Get-Item dist/PacTTSClone-Setup-*.exe
          if ($setup.Length -gt 150MB) { throw 'Installer exceeds 150 MiB.' }
      - name: Interactive wizard folder and delay checks
        shell: powershell
        run: ./installer/test-wizard.ps1 -SetupExe (Get-Item dist/PacTTSClone-Setup-*.exe).FullName
      - name: Actual CPU install, HTTP launch, repeat setup and uninstall
        shell: powershell
        run: ./installer/test-install.ps1 -SetupExe (Get-Item dist/PacTTSClone-Setup-*.exe).FullName
      - name: Print setup failure detail
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/PacTTSClone installation test" -Filter *.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 160 }
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: installer-diagnostics
          path: |
            ${{ runner.temp }}/PacTTSClone installation test/PacTTSClone/data/logs/*.log
            ${{ runner.temp }}/PacTTSClone installation test/PacTTSClone/data/setup/base-constraints.txt
            ${{ runner.temp }}/PacTTSClone installation test-setup.log
            ${{ runner.temp }}/pactts-wizard-*.png
          if-no-files-found: ignore
      - name: Package FFmpeg provenance
        shell: pwsh
        run: Compress-Archive -Path installer/ffmpeg/BUILD-PROVENANCE.txt,installer/ffmpeg/licenses/* -DestinationPath dist/FFmpeg-provenance.zip
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe,dist/*.whl,dist/*.zip | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: PacTTSClone-Windows-setup
          path: |
            dist/*.exe
            dist/*.whl
            dist/SHA256SUMS.txt
            dist/FFmpeg-provenance.zip
      - name: Prepare draft prerelease
        if: ${{ (inputs.publish_draft || inputs.publish_release) && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.3.0-rc.10'
          $existing = @(gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json) | Where-Object tagName -eq $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect releases.' }
          if ($existing) { throw "Release $tag already exists; refusing to replace it." }
          gh release create $tag --draft --prerelease --target $env:GITHUB_SHA --title 'PacTTSClone 0.3.0-rc.10 — Windows bootstrap installer' --notes-file docs/release-0.3.0-rc.10.md dist/*.exe dist/*.whl dist/FFmpeg-provenance.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }

      - name: Publish accepted RC10 prerelease
        if: ${{ inputs.publish_release && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.3.0-rc.10'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify draft release.' }
          if (!$release.draft -or !$release.prerelease -or $release.target_commitish -ne $env:GITHUB_SHA) { throw 'Unexpected release target or state.' }
          $files = @(Get-ChildItem dist/*.exe,dist/*.whl,dist/*.zip,dist/SHA256SUMS.txt)
          if ($release.assets.Count -ne $files.Count) { throw 'Unexpected release assets.' }
          foreach ($file in $files) {
            $asset = @($release.assets | Where-Object name -eq $file.Name)
            $digest = 'sha256:' + (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            if ($asset.Count -ne 1 -or $asset[0].size -ne $file.Length -or $asset[0].digest -ne $digest) { throw "Asset integrity mismatch: $($file.Name)" }
          }
          gh release edit $tag --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish accepted RC10.' }
