name: Publish validated release
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  installer:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'publish-release')
    uses: ./.github/workflows/installer.yml
    with:
      publish_release: true
  # Publication follows full tests, Windows acceptance and uploaded asset verification.
  migration-bridge:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect one-time migration
        id: migration
        run: python -c "import tomllib, os; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; open(os.environ['GITHUB_OUTPUT'],'a').write('needed='+str(v=='2.2.1').lower()+'\n')"
      - name: Build and validate migration wheel
        if: steps.migration.outputs.needed == 'true'
        run: |
          python -m pip install -e '.[dev]'
          python -m pip wheel --no-deps . -w dist
          python scripts/build-update-bridge.py dist/pacttsclone-2.2.1-py3-none-any.whl bridge-dist/pacttsclone-2.3.0rc2-py3-none-any.whl 2.2.1 2.3.0rc2
          python scripts/validate-update-bridge.py bridge-dist/pacttsclone-2.3.0rc2-py3-none-any.whl
      - name: Publish verified bridge and set Latest
        if: steps.migration.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-update-bridge.py
