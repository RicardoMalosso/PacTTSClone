name: Prepare validated RC9 draft
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-rc9
  cancel-in-progress: false
jobs:
  installer:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'prepare-release')
    uses: ./.github/workflows/installer.yml
    with:
      publish_draft: true
  # The installer workflow creates a new draft release on main after all gates.
  # Leave it unpublished so the owner can verify the artifacts before publishing.
