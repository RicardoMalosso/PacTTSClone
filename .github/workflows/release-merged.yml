name: Publish validated RC11
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-rc11
  cancel-in-progress: false
jobs:
  installer:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'publish-release')
    uses: ./.github/workflows/installer.yml
    with:
      publish_release: true
  # Publication follows full tests, Windows acceptance and uploaded asset verification.
