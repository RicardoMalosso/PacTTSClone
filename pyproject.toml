[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pacttsclone"
version = "2.2.0rc1"
description = "Local OmniVoice voice cloning to MP3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "numpy>=1.26,<3", "soundfile>=0.13,<1",
  "psutil>=6,<8", "nvidia-ml-py>=12,<14", "websockets>=15,<17", "Pillow>=10,<13",
  "packaging>=24,<27",
]

[project.optional-dependencies]
inference = [
  "omnivoice==0.2.1", "transformers==5.20.2",
  "torch==2.8.0", "torchaudio==2.8.0",
]
dev = ["pytest>=8,<9", "pytest-timeout>=2.4,<3", "httpx>=0.27,<1", "ruff>=0.11,<1"]
browser = ["pytest-playwright>=0.7,<1", "playwright==1.56.0"]

[project.scripts]
pacttsclone = "pacttsclone.cli:main"
pacttsclone-smoke = "pacttsclone.cli:smoke"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pacttsclone = ["static/*", "assets/voices/*", "ming_*.json", "ming_requirements.txt", "kitten_*.json", "kitten_requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["browser"]
timeout = 60

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

